<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16624f">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="container">
      <p class="eyebrow">設備・網路・環境</p>
      <h1>報修登記</h1>
      <p>把問題記下來，讓處理更有條理。</p>
    </div>
  </header>
  <main class="container">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="hint">以下欄位皆為必填。此為公開示範，請使用虛構姓名與地點，勿填個人資料。</p>
      <noscript><p class="message error">請啟用 JavaScript，才能送出報修及讀取清單。</p></noscript>
      <form id="repair-form">
        <fieldset id="form-fields" disabled>
          <div class="form-grid">
            <label>報修人<input aria-label="報修人" id="reporter_name" name="reporter_name" required maxlength="100" placeholder="例如：虛構人員甲" autocomplete="off"></label>
            <label>地點或部門<input aria-label="地點或部門" id="location" name="location" required maxlength="200" placeholder="例如：虛構示範區甲" autocomplete="off"></label>
            <label>類別<select aria-label="類別" id="category" name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select aria-label="緊急程度" id="urgency" name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
            <label class="full-width">問題說明<textarea aria-label="問題說明" id="description" name="description" required maxlength="2000" rows="5" placeholder="請描述發生的問題與情況（最多 2000 字）"></textarea></label>
          </div>
          <div class="submit-row"><p class="hint">登記時間自動產生，初始狀態為「待處理」。</p><button type="submit" id="submit-button">送出報修</button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading"><div><h2 id="list-title">最近報修</h2><p class="hint">最近 20 筆・由新到舊・時間依你的裝置時區顯示</p></div><button id="refresh-button" class="secondary" type="button" disabled>重新整理</button></div>
      <div class="urgency-filters" role="group" aria-label="依緊急程度篩選">
        <button type="button" class="filter-button" data-urgency="全部" aria-pressed="true">全部</button>
        <button type="button" class="filter-button" data-urgency="高" aria-pressed="false">高</button>
        <button type="button" class="filter-button" data-urgency="中" aria-pressed="false">中</button>
        <button type="button" class="filter-button" data-urgency="低" aria-pressed="false">低</button>
      </div>
      <p class="hint filter-summary" id="filter-summary" role="status" aria-live="polite" hidden></p>
      <p id="list-message" class="message" role="status" aria-live="polite">正在載入清單…</p>
      <ol id="request-list" class="request-list" aria-label="最近二十筆報修"></ol>
    </section>
  </main>
  <footer class="container">報修登記示範系統・清單內容公開可見</footer>
</body>
</html>
